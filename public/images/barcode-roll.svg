<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="yellowRoll" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="labelStrip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="rollGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.2"/>
    </filter>
  </defs>

  <ellipse cx="250" cy="420" rx="170" ry="22" fill="#0f172a" opacity="0.12" />

  <g filter="url(#rollGlow)">
    <!-- Main Cylinder -->
    <g transform="translate(100, 100)">
      <path d="M 50 40 L 220 120 A 70 40 0 0 1 180 230 L 10 150 A 70 40 0 0 1 50 40 Z" fill="url(#yellowRoll)" stroke="#cbd5e1" stroke-width="1.5"/>
      <ellipse cx="50" cy="135" rx="50" ry="70" transform="rotate(-25 50 135)" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
      <ellipse cx="50" cy="135" rx="18" ry="25" transform="rotate(-25 50 135)" fill="#0f172a"/>
      
      <!-- Stepped label roll edge -->
      <ellipse cx="50" cy="135" rx="42" ry="58" transform="rotate(-25 50 135)" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="8,4"/>
    </g>

    <!-- Unwound Barcode Label Strip -->
    <g transform="translate(180, 210) rotate(18)">
      <path d="M 0 0 L 180 0 L 210 160 L 30 160 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      
      <!-- Barcode 1 -->
      <rect x="25" y="15" width="130" height="50" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
      <g transform="translate(40, 25)">
        <line x1="0" y1="0" x2="0" y2="25" stroke="#0f172a" stroke-width="2"/>
        <line x1="4" y1="0" x2="4" y2="25" stroke="#0f172a" stroke-width="4"/>
        <line x1="12" y1="0" x2="12" y2="25" stroke="#0f172a" stroke-width="1.5"/>
        <line x1="18" y1="0" x2="18" y2="25" stroke="#0f172a" stroke-width="3"/>
        <line x1="26" y1="0" x2="26" y2="25" stroke="#0f172a" stroke-width="5"/>
        <line x1="36" y1="0" x2="36" y2="25" stroke="#0f172a" stroke-width="2"/>
        <line x1="44" y1="0" x2="44" y2="25" stroke="#0f172a" stroke-width="4"/>
        <line x1="56" y1="0" x2="56" y2="25" stroke="#0f172a" stroke-width="1.5"/>
        <line x1="64" y1="0" x2="64" y2="25" stroke="#0f172a" stroke-width="3"/>
        <line x1="74" y1="0" x2="74" y2="25" stroke="#0f172a" stroke-width="4"/>
        <line x1="84" y1="0" x2="84" y2="25" stroke="#0f172a" stroke-width="2"/>
        <line x1="92" y1="0" x2="92" y2="25" stroke="#0f172a" stroke-width="3.5"/>
      </g>
      <text x="90" y="58" font-family="monospace" font-size="7" font-weight="700" fill="#475569" text-anchor="middle">8 901234 567890</text>

      <!-- Barcode 2 -->
      <rect x="35" y="80" width="130" height="50" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
      <g transform="translate(50, 90)">
        <line x1="0" y1="0" x2="0" y2="25" stroke="#0284c7" stroke-width="2"/>
        <line x1="4" y1="0" x2="4" y2="25" stroke="#0284c7" stroke-width="4"/>
        <line x1="12" y1="0" x2="12" y2="25" stroke="#0284c7" stroke-width="1.5"/>
        <line x1="18" y1="0" x2="18" y2="25" stroke="#0284c7" stroke-width="3"/>
        <line x1="26" y1="0" x2="26" y2="25" stroke="#0284c7" stroke-width="5"/>
        <line x1="36" y1="0" x2="36" y2="25" stroke="#0284c7" stroke-width="2"/>
        <line x1="44" y1="0" x2="44" y2="25" stroke="#0284c7" stroke-width="4"/>
        <line x1="56" y1="0" x2="56" y2="25" stroke="#0284c7" stroke-width="1.5"/>
        <line x1="64" y1="0" x2="64" y2="25" stroke="#0284c7" stroke-width="3"/>
        <line x1="74" y1="0" x2="74" y2="25" stroke="#0284c7" stroke-width="4"/>
        <line x1="84" y1="0" x2="84" y2="25" stroke="#0284c7" stroke-width="2"/>
      </g>
    </g>
  </g>
</svg>
