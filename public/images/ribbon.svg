<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ribbonBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="30%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cardboardCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="ribbonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.2"/>
    </filter>
  </defs>

  <ellipse cx="250" cy="430" rx="160" ry="20" fill="#0f172a" opacity="0.16" />

  <g filter="url(#ribbonGlow)" transform="translate(70, 110)">
    <!-- Supply Spool -->
    <g transform="translate(50, 40)">
      <!-- Main Black Roll -->
      <path d="M 40 20 L 260 90 A 50 30 0 0 1 230 180 L 10 110 A 50 30 0 0 1 40 20 Z" fill="url(#ribbonBlack)" stroke="#475569" stroke-width="1.5"/>
      <!-- Side Flange & Notched Core -->
      <ellipse cx="30" cy="95" rx="35" ry="50" transform="rotate(-25 30 95)" fill="#0f172a" stroke="#475569" stroke-width="2"/>
      <ellipse cx="30" cy="95" rx="16" ry="22" transform="rotate(-25 30 95)" fill="url(#cardboardCore)"/>
      <ellipse cx="30" cy="95" rx="8" ry="12" transform="rotate(-25 30 95)" fill="#020617"/>
      <!-- Notches -->
      <rect x="26" y="70" width="8" height="6" fill="#020617" transform="rotate(-25 30 95)"/>
      <rect x="26" y="114" width="8" height="6" fill="#020617" transform="rotate(-25 30 95)"/>
    </g>

    <!-- Glossy Carbon Sheen -->
    <path d="M 120 70 Q 220 100 300 135" stroke="#38bdf8" stroke-width="3" opacity="0.6" fill="none"/>
    <path d="M 130 95 Q 230 125 290 150" stroke="#ffffff" stroke-width="1.5" opacity="0.4" fill="none"/>

    <!-- Brand Label Band around ribbon -->
    <path d="M 170 80 L 210 93 L 195 145 L 155 132 Z" fill="#0284c7" opacity="0.9"/>
    <text x="183" y="116" font-family="system-ui, sans-serif" font-size="7" font-weight="900" fill="#ffffff" transform="rotate(18 183 116)">WIZE WAX</text>
  </g>
</svg>
