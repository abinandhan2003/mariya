<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="itShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.2"/>
    </filter>
  </defs>

  <ellipse cx="250" cy="430" rx="160" ry="20" fill="#0f172a" opacity="0.16" />

  <g filter="url(#itShadow)" transform="translate(100, 100)">
    <!-- USB / Interface Converter Box -->
    <rect x="50" y="80" width="200" height="130" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="70" y="100" width="160" height="40" rx="8" fill="#0f172a"/>
    <text x="150" y="125" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">POS INTERFACE</text>

    <circle cx="90" cy="170" r="5" fill="#22c55e" filter="drop-shadow(0 0 4px #22c55e)"/>
    <circle cx="115" cy="170" r="5" fill="#38bdf8" filter="drop-shadow(0 0 4px #38bdf8)"/>

    <!-- Gold Plated Connectors & Braided Cable Coils -->
    <path d="M 150 210 C 150 280, 50 250, 60 320 C 70 380, 230 380, 240 320 C 250 260, 230 250, 230 210" 
          fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>
    
    <!-- USB Plug Head -->
    <g transform="translate(45, 305) rotate(45)">
      <rect x="0" y="0" width="30" height="50" rx="6" fill="#334155"/>
      <rect x="6" y="-20" width="18" height="20" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
      <rect x="10" y="-14" width="4" height="6" fill="#0f172a"/>
      <rect x="16" y="-14" width="4" height="6" fill="#0f172a"/>
    </g>
  </g>
</svg>
