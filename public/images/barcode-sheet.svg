<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="sheetShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.18"/>
    </filter>
  </defs>

  <ellipse cx="250" cy="430" rx="160" ry="20" fill="#0f172a" opacity="0.10" />

  <g filter="url(#sheetShadow)" transform="translate(100, 60) rotate(-6)">
    <!-- Main A4 Sheet -->
    <rect x="0" y="0" width="280" height="380" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Header stripe -->
    <rect x="15" y="15" width="250" height="24" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
    <text x="25" y="31" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0284c7">MARIYA A4 LASER/INKJET LABEL SHEET</text>

    <!-- 3x8 Grid of Sticker Labels -->
    <g transform="translate(15, 50)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="75" height="40" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="87" y="0" width="75" height="40" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="175" y="0" width="75" height="40" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Row 2 -->
      <rect x="0" y="50" width="75" height="40" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="87" y="50" width="75" height="40" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="175" y="50" width="75" height="40" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Row 3 - Highlighted peeling label -->
      <rect x="0" y="100" width="75" height="40" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <g transform="translate(87, 100)">
        <rect x="0" y="0" width="75" height="40" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
        <path d="M 50 40 L 75 15 L 75 40 Z" fill="#93c5fd"/>
      </g>
      <rect x="175" y="100" width="75" height="40" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Row 4 -->
      <rect x="0" y="150" width="75" height="40" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="87" y="150" width="75" height="40" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="175" y="150" width="75" height="40" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Row 5 -->
      <rect x="0" y="200" width="75" height="40" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="87" y="200" width="75" height="40" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="175" y="200" width="75" height="40" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Row 6 -->
      <rect x="0" y="250" width="75" height="40" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="87" y="250" width="75" height="40" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="175" y="250" width="75" height="40" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    </g>
  </g>
</svg>
