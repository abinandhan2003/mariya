<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="rollGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="rollSideGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#64748b"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0284c7" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="250" cy="420" rx="190" ry="28" fill="#000000" opacity="0.08" />
  <ellipse cx="250" cy="415" rx="140" ry="16" fill="#0284c7" opacity="0.12" />

  <g filter="url(#softShadow)">
    <!-- BACK ROLL (Right) -->
    <g transform="translate(190, 110)">
      <path d="M 90 40 L 90 200 A 45 45 0 0 1 0 200 L 0 40 A 45 45 0 0 1 90 40 Z" fill="url(#rollGrad1)" />
      <!-- Top Ellipse -->
      <ellipse cx="45" cy="40" rx="45" ry="30" fill="url(#rollSideGrad)" stroke="#e2e8f0" stroke-width="1.5"/>
      <ellipse cx="45" cy="40" rx="14" ry="10" fill="url(#coreGrad)" />
      <!-- Unrolled tail -->
      <path d="M 90 80 Q 150 110 170 190 L 120 190 Q 100 130 90 120 Z" fill="#ffffff" stroke="#e2e8f0" opacity="0.95"/>
    </g>

    <!-- FRONT MAIN ROLL (Left angled) -->
    <g transform="translate(60, 140)">
      <!-- Roll body -->
      <path d="M 60 50 L 220 130 A 60 35 0 0 1 190 200 L 30 120 A 60 35 0 0 1 60 50 Z" fill="url(#rollGrad1)" />
      <!-- Front Flat Side (Cylinder end) -->
      <ellipse cx="60" cy="120" rx="45" ry="60" transform="rotate(-25 60 120)" fill="url(#rollSideGrad)" stroke="#e2e8f0" stroke-width="2"/>
      <!-- Inner Core -->
      <ellipse cx="60" cy="120" rx="15" ry="20" transform="rotate(-25 60 120)" fill="url(#coreGrad)"/>
      <ellipse cx="60" cy="120" rx="8" ry="11" transform="rotate(-25 60 120)" fill="#020617"/>

      <!-- Cylinder Top Curvature Highlight -->
      <path d="M 40 65 Q 120 100 200 142" stroke="#ffffff" stroke-width="4" fill="none" opacity="0.8"/>
      
      <!-- Premium Paper Texture subtle ring -->
      <ellipse cx="60" cy="120" rx="35" ry="46" transform="rotate(-25 60 120)" fill="none" stroke="#cbd5e1" stroke-width="0.75" stroke-dasharray="3,3"/>
    </g>
  </g>
</svg>
