<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="barcodePrinterBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="bpShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.2"/>
    </filter>
  </defs>

  <ellipse cx="250" cy="430" rx="170" ry="24" fill="#0f172a" opacity="0.16" />

  <g filter="url(#bpShadow)" transform="translate(80, 90)">
    <!-- Base Chassis -->
    <path d="M 30 140 L 310 140 L 330 300 L 10 300 Z" fill="url(#barcodePrinterBody)" stroke="#334155" stroke-width="2"/>
    
    <!-- Top Clamshell Lid -->
    <path d="M 40 140 Q 170 60 300 140 L 300 200 L 40 200 Z" fill="#334155" stroke="#475569"/>
    
    <!-- Transparent Inspection Window -->
    <rect x="100" y="100" width="140" height="60" rx="10" fill="#0369a1" opacity="0.6" stroke="#38bdf8" stroke-width="2"/>
    <!-- Internal ribbon roll visual through window -->
    <ellipse cx="170" cy="130" rx="40" ry="16" fill="#020617"/>
    <ellipse cx="170" cy="130" rx="15" ry="6" fill="#f8fafc"/>

    <!-- Output Label Dispenser -->
    <rect x="60" y="240" width="220" height="14" rx="4" fill="#020617"/>
    
    <!-- Output Label Coming Out -->
    <g transform="translate(100, 245)">
      <rect x="0" y="0" width="140" height="70" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <g transform="translate(20, 15)">
        <line x1="0" y1="0" x2="0" y2="25" stroke="#0f172a" stroke-width="3"/>
        <line x1="6" y1="0" x2="6" y2="25" stroke="#0f172a" stroke-width="1.5"/>
        <line x1="14" y1="0" x2="14" y2="25" stroke="#0f172a" stroke-width="4"/>
        <line x1="24" y1="0" x2="24" y2="25" stroke="#0f172a" stroke-width="2"/>
        <line x1="32" y1="0" x2="32" y2="25" stroke="#0f172a" stroke-width="5"/>
        <line x1="44" y1="0" x2="44" y2="25" stroke="#0f172a" stroke-width="2"/>
        <line x1="52" y1="0" x2="52" y2="25" stroke="#0f172a" stroke-width="4"/>
        <line x1="64" y1="0" x2="64" y2="25" stroke="#0f172a" stroke-width="3"/>
        <line x1="74" y1="0" x2="74" y2="25" stroke="#0f172a" stroke-width="1.5"/>
        <line x1="82" y1="0" x2="82" y2="25" stroke="#0f172a" stroke-width="4"/>
        <line x1="94" y1="0" x2="94" y2="25" stroke="#0f172a" stroke-width="2"/>
      </g>
      <text x="70" y="55" font-family="monospace" font-size="8" font-weight="700" fill="#334155" text-anchor="middle">TSC TE244 HIGH SPEED</text>
    </g>

    <!-- Side Release Lever -->
    <rect x="315" y="160" width="16" height="30" rx="4" fill="#0284c7"/>
    
    <!-- Control LED and Button -->
    <circle cx="50" cy="220" r="5" fill="#22c55e" filter="drop-shadow(0 0 4px #22c55e)"/>
    <circle cx="70" cy="220" r="5" fill="#38bdf8" filter="drop-shadow(0 0 4px #38bdf8)"/>
    <rect x="250" y="210" width="40" height="20" rx="4" fill="#1e293b" stroke="#475569"/>
    <text x="270" y="224" font-family="system-ui, sans-serif" font-size="8" font-weight="800" fill="#38bdf8" text-anchor="middle">PAUSE</text>
  </g>
</svg>
