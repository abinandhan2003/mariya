<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="logoRollGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  
  <!-- Logo Icon: Stylized M with Rolling Ribbon Ring -->
  <g transform="translate(10, 10)">
    <!-- Outer Glow Circle -->
    <rect x="0" y="0" width="60" height="60" rx="14" fill="url(#logoBlueGrad)"/>
    
    <!-- Paper roll loop -->
    <path d="M 15 45 C 15 25, 45 25, 45 35 C 45 45, 25 45, 25 35 C 25 28, 38 28, 38 35" 
          fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Stylized M letter accent -->
    <path d="M 18 42 L 25 20 L 30 32 L 35 20 L 42 42" 
          fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="30" cy="16" r="3.5" fill="#facc15"/>
  </g>

  <!-- Brand Typography -->
  <text x="80" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#0f172a" letter-spacing="1.5">
    MARIYA
  </text>
  <text x="180" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#0284c7" letter-spacing="1.5">
    INDUSTRIES
  </text>
  
  <text x="82" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#64748b" letter-spacing="2.2">
    TRUST PRINTED IN EVERY ROLL
  </text>
  
  <!-- Tiny Est. badge -->
  <rect x="250" y="44" width="55" height="15" rx="4" fill="#e0f2fe"/>
  <text x="277" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" fill="#0369a1" text-anchor="middle">EST. 2011</text>
</svg>
